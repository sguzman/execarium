[package]
name = "execarium"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Strict, versioned YAML job specification and validation-only CLI"
license = "MIT"
repository = "https://github.com/sguzman/execarium"
readme = "README.md"
keywords = ["yaml", "jobs", "shell", "validation"]
categories = ["config", "parsing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
yaml-rust2 = "0.11"
thiserror = "2"
