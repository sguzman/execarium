name: Rust and schema conformance

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Build and unit/conformance tests
        run: cargo test --all-targets
      - name: Documentation tests
        run: cargo test --doc
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Independent crate version and schema compatibility
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = "' Cargo.toml | cut -d '"' -f2)"
          test -n "$version"
          cargo run --quiet -- --version | grep -Fx "execarium $version (schemas: 1,2,3,4)"
      - name: Rust typed-construction example round-trips
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --example create_yaml | ./target/debug/execarium validate - | grep -q 'Valid Execarium schema 1'
      - name: CLI accepts documented examples
        shell: bash
        run: |
          set -euo pipefail
          cargo build --quiet
          for example in examples/local-fish.yaml examples/multiline-fish.yaml examples/privileged-doas.yaml; do
            ./target/debug/execarium validate "$example" | grep -q 'Valid Execarium schema 1.*timeout_seconds='
          done
          ./target/debug/execarium validate - < examples/multiline-fish.yaml | grep -q 'Valid Execarium schema 1'
      - name: Portable schema-1 fixture corpus matches CLI
        shell: bash
        run: |
          set -euo pipefail
          for yaml in tests/fixtures/v1/valid/*.yaml; do
            ./target/debug/execarium validate "$yaml" | grep -q 'Valid Execarium schema 1'
          done
          for yaml in tests/fixtures/v1/invalid/*.yaml; do
            if ./target/debug/execarium validate "$yaml"; then
              echo "Rejected corpus fixture was accepted: $yaml" >&2
              exit 1
            fi
          done
      - name: Schema-2 CLI sequence acceptance and strict rejection
        shell: bash
        run: |
          set -euo pipefail
          ./target/debug/execarium validate examples/sequence-fish.yaml | grep -q 'Valid Execarium schema 2.*steps=3'
          if ./target/debug/execarium validate examples/invalid-sequence-v2.yaml; then
            echo "Schema-2 non-string step must be rejected" >&2
            exit 1
          fi
          if sed 's/schema: 2/schema: 1/' examples/sequence-fish.yaml | ./target/debug/execarium validate -; then
            echo "v1 must reject v2 commands key" >&2
            exit 1
          fi
          if sed 's/commands:/command:/' examples/sequence-fish.yaml | ./target/debug/execarium validate -; then
            echo "v2 must reject v1 command key" >&2
            exit 1
          fi
      - name: Schema-3 examples and portable conformance corpus
        shell: bash
        run: |
          set -euo pipefail
          ./target/debug/execarium validate examples/hyprland-fish-v3.yaml | grep -q 'Valid Execarium schema 3.*session=hyprland, gpu=nvidia, steps=1'
          ./target/debug/execarium validate examples/steps-wayland-v3.yaml | grep -q 'Valid Execarium schema 3.*session=wayland, gpu=integrated, steps=3'
          for yaml in tests/fixtures/v3/valid/*.yaml; do
            ./target/debug/execarium validate "$yaml" | grep -q 'Valid Execarium schema 3'
          done
          for yaml in tests/fixtures/v3/invalid/*.yaml; do
            if ./target/debug/execarium validate "$yaml"; then
              echo "Invalid schema-3 fixture was accepted: $yaml" >&2
              exit 1
            fi
          done
          if sed 's/schema: 3/schema: 2/' examples/hyprland-fish-v3.yaml | ./target/debug/execarium validate -; then
            echo "v2 must reject v3 environment" >&2
            exit 1
          fi
      - name: CLI rejects unsupported input without executing it
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          cat > "$root/invalid.yaml" <<'EOF'
          schema: 1
          shell: fish
          cwd: /tmp
          privilege: none
          timeout_seconds: 600
          command: echo not-run
          executor: local
          EOF
          if ./target/debug/execarium validate "$root/invalid.yaml"; then
            echo 'unknown key should have been rejected' >&2
            exit 1
          fi
          cat > "$root/duplicate.yaml" <<'EOF'
          schema: 1
          shell: fish
          shell: bash
          cwd: /tmp
          privilege: none
          timeout_seconds: 600
          command: echo not-run
          EOF
          if ./target/debug/execarium validate "$root/duplicate.yaml"; then
            echo 'duplicate key should have been rejected' >&2
            exit 1
          fi
          cat > "$root/unsupported.yaml" <<'EOF'
          schema: 4
          shell: fish
          cwd: /tmp
          privilege: none
          timeout_seconds: 600
          command: echo not-run
          EOF
          if ./target/debug/execarium validate "$root/unsupported.yaml"; then
            echo 'unsupported schema should have been rejected' >&2
            exit 1
          fi
          cat > "$root/invalid-timeout.yaml" <<'EOF'
          schema: 1
          shell: fish
          cwd: /tmp
          privilege: none
          timeout_seconds: 0
          command: echo not-run
          EOF
          if ./target/debug/execarium validate "$root/invalid-timeout.yaml"; then
            echo 'zero timeout should have been rejected' >&2
            exit 1
          fi
          test ! -e "$root/not-run"

  tag_release:
    name: Publish verified crate release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Create immutable version tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = "' Cargo.toml | cut -d '"' -f2)"
          test -n "$version"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; leaving its original commit and release unchanged"
            exit 0
          fi
          cargo build --release
          mkdir -p dist/package
          install -m755 target/release/execarium dist/package/execarium
          cp LICENSE README.md docs/SPEC-v1.md docs/SPEC-v2.md docs/SPEC-v3.md dist/package/
          tar -czf dist/execarium-linux-x86_64.tar.gz -C dist/package .
          (cd dist && sha256sum execarium-linux-x86_64.tar.gz > SHA256SUMS)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Execarium $tag: schemas 1, 2 and 3 library" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          gh release create "$tag" dist/execarium-linux-x86_64.tar.gz dist/SHA256SUMS --title "Execarium $tag" --generate-notes --verify-tag
