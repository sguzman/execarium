name: Rust and schema conformance

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Build and unit/conformance tests
        run: cargo test --all-targets
      - name: Documentation tests
        run: cargo test --doc
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Release version and schema stay aligned
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version = "1.0.0"' Cargo.toml
          cargo run --quiet -- --version | grep -Fx 'execarium 1.0.0 (schema: 1)'
      - name: CLI accepts documented examples
        shell: bash
        run: |
          set -euo pipefail
          cargo build --quiet
          for example in examples/*.yaml; do
            ./target/debug/execarium validate "$example" | grep -q 'Valid Execarium schema 1.*timeout_seconds='
          done
          ./target/debug/execarium validate - < examples/multiline-fish.yaml | grep -q 'Valid Execarium schema 1'
      - name: CLI rejects unsupported input without executing it
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          cat > "$root/invalid.yaml" <<'EOF'
          schema: 1
          shell: fish
          cwd: /tmp
          privilege: none
          timeout_seconds: 600
          command: echo not-run
          executor: local
          EOF
          if ./target/debug/execarium validate "$root/invalid.yaml"; then
            echo 'unknown key should have been rejected' >&2
            exit 1
          fi
          cat > "$root/duplicate.yaml" <<'EOF'
          schema: 1
          shell: fish
          shell: bash
          cwd: /tmp
          privilege: none
          timeout_seconds: 600
          command: echo not-run
          EOF
          if ./target/debug/execarium validate "$root/duplicate.yaml"; then
            echo 'duplicate key should have been rejected' >&2
            exit 1
          fi
          cat > "$root/unsupported.yaml" <<'EOF'
          schema: 2
          shell: fish
          cwd: /tmp
          privilege: none
          timeout_seconds: 600
          command: echo not-run
          EOF
          if ./target/debug/execarium validate "$root/unsupported.yaml"; then
            echo 'unsupported schema should have been rejected' >&2
            exit 1
          fi
          cat > "$root/invalid-timeout.yaml" <<'EOF'
          schema: 1
          shell: fish
          cwd: /tmp
          privilege: none
          timeout_seconds: 0
          command: echo not-run
          EOF
          if ./target/debug/execarium validate "$root/invalid-timeout.yaml"; then
            echo 'zero timeout should have been rejected' >&2
            exit 1
          fi
          test ! -e "$root/not-run"

  tag_v1:
    name: Tag verified v1.0.0 release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag exactly this verified revision, once
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version = "1.0.0"' Cargo.toml
          # A release tag is immutable. Later main commits must not move it.
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null; then
            echo "v1.0.0 is already tagged; leaving it unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.0.0 -m "Execarium v1.0.0: stable schema 1" "$GITHUB_SHA"
          git push origin refs/tags/v1.0.0
